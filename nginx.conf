server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Hashed filenames, so these can be cached hard and for a long time.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # index.html is NOT cached: it names the hashed assets, so a cached copy
    # would keep pointing at the previous deploy's files.
    location = /index.html {
        add_header Cache-Control "no-cache";
    }

    # Single page - anything unrecognised still serves it rather than 404ing.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
